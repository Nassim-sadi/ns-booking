name: Release plugin zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          mkdir -p dist/ns-booking
          rsync -r --exclude='.git' --exclude='.github' --exclude='*.zip' --exclude='.gitignore' ./ dist/ns-booking/
          (cd dist && zip -rq "ns-booking-${{ steps.version.outputs.VERSION }}.zip" ns-booking)

      - name: Verify archive root
        run: |
          unzip -l "dist/ns-booking-${{ steps.version.outputs.VERSION }}.zip" | grep "ns-booking.php"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: dist/ns-booking-*.zip